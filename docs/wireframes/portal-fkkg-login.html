<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal FKKG - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #60a5fa 100%);
        }
        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen gradient-bg flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo dan Header -->
        <div class="text-center mb-8">
            <div class="bg-white/20 rounded-full w-20 h-20 mx-auto mb-4 flex items-center justify-center">
                <i class="fas fa-graduation-cap text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Portal FKKG</h1>
            <p class="text-blue-100">Forum Komunikasi Guru dan Kepala Sekolah</p>
        </div>

        <!-- Form Login -->
        <div class="glass-effect rounded-2xl p-8 shadow-2xl">
            <form class="space-y-6">
                <div>
                    <label class="block text-white font-medium mb-2">Email / Username</label>
                    <div class="relative">
                        <input type="text" class="w-full px-4 py-3 pl-12 rounded-xl bg-white/20 text-white placeholder-white/70 border border-white/30 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent">
                        <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-white/70"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-white font-medium mb-2">Password</label>
                    <div class="relative">
                        <input type="password" class="w-full px-4 py-3 pl-12 pr-12 rounded-xl bg-white/20 text-white placeholder-white/70 border border-white/30 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent">
                        <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-white/70"></i>
                        <button type="button" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-white/70 hover:text-white">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center text-white">
                        <input type="checkbox" class="mr-2 rounded">
                        <span class="text-sm">Ingat saya</span>
                    </label>
                    <a href="#" class="text-blue-200 hover:text-white text-sm">Lupa password?</a>
                </div>

                <button type="submit" class="w-full bg-white text-blue-600 font-bold py-3 rounded-xl hover:bg-blue-50 transition duration-200 shadow-lg">
                    <i class="fas fa-sign-in-alt mr-2"></i>Masuk
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6">
            <p class="text-blue-200 text-sm">
                © 2024 FKKG. Hak Cipta Dilindungi.
            </p>
        </div>
    </div>
</body>
</html>
