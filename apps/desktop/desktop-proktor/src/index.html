<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TKA Proktor - Dashboard Pengawasan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans overflow-hidden h-screen">
    <div id="app" class="h-full flex flex-col">
        <!-- Header -->
        <header class="h-20 bg-slate-900 text-white flex items-center justify-between px-10 shadow-xl z-50">
            <div class="flex items-center gap-6">
                <div class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center font-black shadow-lg shadow-orange-600/20">P</div>
                <div>
                    <h1 class="text-lg font-black tracking-tight">DASHBOARD PROKTOR</h1>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Sistem Pengawasan Ujian Nasional</p>
                </div>
            </div>
            
            <div class="flex items-center gap-8">
                <div class="flex gap-4">
                    <div class="text-right">
                        <p class="text-[10px] font-black text-slate-500 uppercase">Status Server</p>
                        <p class="text-xs font-bold text-emerald-400 flex items-center gap-1.5 justify-end">
                            <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span> ONLINE
                        </p>
                    </div>
                    <div class="h-8 w-px bg-slate-800"></div>
                    <div class="text-right">
                        <p class="text-[10px] font-black text-slate-500 uppercase">Sesi Aktif</p>
                        <p class="text-xs font-bold">SESI 1 - LAB KOMP 1</p>
                    </div>
                </div>
                <button id="broadcastBtn" class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-2.5 rounded-xl font-black text-xs shadow-lg shadow-orange-600/20 transition-all active:scale-95">
                    SIARKAN PESAN
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex overflow-hidden">
            <!-- Sidebar Navigation -->
            <aside class="w-64 bg-white border-r border-slate-200 p-6 flex flex-col gap-2 overflow-y-auto">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 ml-2">Menu Utama</h3>
                <button class="flex items-center gap-3 p-4 bg-slate-900 text-white rounded-2xl font-bold text-sm shadow-xl shadow-slate-900/10">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                    Monitoring
                </button>
                <button class="flex items-center gap-3 p-4 text-slate-500 hover:bg-slate-50 rounded-2xl font-bold text-sm transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
                    Audit Log
                </button>
                <button class="flex items-center gap-3 p-4 text-slate-500 hover:bg-slate-50 rounded-2xl font-bold text-sm transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    Chat Siswa
                </button>
                
                <div class="mt-auto p-5 bg-blue-50 border border-blue-100 rounded-2xl">
                    <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-1">Bantuan</p>
                    <p class="text-[10px] text-blue-400 font-bold leading-relaxed">Hubungi IT Support Disdik jika server mengalami kendala sinkronisasi.</p>
                </div>
            </aside>

            <!-- Monitoring Grid -->
            <div class="flex-1 p-10 overflow-y-auto space-y-10">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-2xl font-black text-slate-900">Daftar Peserta (Sesi 1)</h2>
                        <p class="text-sm font-bold text-slate-400">Memantau 40 Siswa secara Real-time</p>
                    </div>
                    <div class="flex gap-3">
                        <div class="bg-white px-4 py-2 rounded-xl border border-slate-200 flex items-center gap-3">
                            <div class="w-2 h-2 bg-emerald-500 rounded-full"></div>
                            <span class="text-xs font-black">38 ONLINE</span>
                        </div>
                        <div class="bg-white px-4 py-2 rounded-xl border border-slate-200 flex items-center gap-3">
                            <div class="w-2 h-2 bg-red-500 rounded-full"></div>
                            <span class="text-xs font-black">2 OFFLINE</span>
                        </div>
                    </div>
                </div>

                <div id="studentGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                    <!-- Student Cards will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Alert Toast Container -->
    <div id="alertContainer" class="fixed bottom-8 right-8 w-96 space-y-4 z-[100]"></div>

    <script src="renderer.js"></script>
</body>
</html>
