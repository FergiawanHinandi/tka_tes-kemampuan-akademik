version: '3.9'

services:
  # Database Services
  postgres:
    image: postgres:16-alpine
    container_name: tka-postgres
    environment:
      POSTGRES_DB: tka_ujian
      POSTGRES_USER: tka_admin
      POSTGRES_PASSWORD: tka_secret_2026
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - tka-network

  redis:
    image: redis:7-alpine
    container_name: tka-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - tka-network

  # File Storage
  minio:
    image: minio/minio:latest
    container_name: tka-minio
    environment:
      MINIO_ROOT_USER: tka_minio
      MINIO_ROOT_PASSWORD: tka_minio_2026
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - tka-network

  # Monitoring & Observability
  grafana:
    image: grafana/grafana:latest
    container_name: tka-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: tka_grafana_2026
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - tka-network

  prometheus:
    image: prom/prometheus:latest
    container_name: tka-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - tka-network

  # Load Balancer
  nginx:
    image: nginx:alpine
    container_name: tka-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - tka-network

  # Backend API (Development)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: tka-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://tka_admin:tka_secret_2026@postgres:5432/tka_ujian
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: tka_minio
      MINIO_SECRET_KEY: tka_minio_2026
      JWT_SECRET: tka_jwt_secret_2026
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - tka-network

  # Supabase (Optional - if using Supabase instead of direct PostgreSQL)
  supabase:
    image: supabase/supabase:latest
    container_name: tka-supabase
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: tka_ujian
      POSTGRES_USER: tka_admin
      POSTGRES_PASSWORD: tka_secret_2026
    depends_on:
      - postgres
    networks:
      - tka-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
  prometheus_data:

networks:
  tka-network:
    driver: bridge